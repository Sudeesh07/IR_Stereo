# ------------------------------------------------------------------------
# Custom test config for I-NAFSSR (x2)
# Mirrors the structure of existing test YAMLs
# ------------------------------------------------------------------------
# general settings
name: I-NAFSSR_x2_test
model_type: ImageRestorationModel
scale: 2
num_gpu: 1 # set num_gpu: 0 for cpu mode
manual_seed: 10

# dataset and data loader settings
datasets:
  test0:
    name: KITTI2012
    type: PairedStereoImageDataset
    dataroot_gt: datasets/StereoSR/test/KITTI2012/hr
    dataroot_lq: datasets/StereoSR/test/KITTI2012/lr_x2
    io_backend:
      type: disk

  test1:
    name: KITTI2015
    type: PairedStereoImageDataset
    dataroot_gt: datasets/StereoSR/test/KITTI2015/hr
    dataroot_lq: datasets/StereoSR/test/KITTI2015/lr_x2
    io_backend:
      type: disk
  
  test2:
    name: Middlebury
    type: PairedStereoImageDataset
    dataroot_gt: datasets/StereoSR/test/Middlebury/hr
    dataroot_lq: datasets/StereoSR/test/Middlebury/lr_x2
    io_backend:
      type: disk
  
  test3:
    name: Flickr1024
    type: PairedStereoImageDataset
    dataroot_gt: datasets/StereoSR/test/Flickr1024/hr
    dataroot_lq: datasets/StereoSR/test/Flickr1024/lr_x2
    io_backend:
      type: disk

# network structures
network_g:
  type: InnovativeNAFSSR
  up_scale: 2
  width: 64
  num_recursive_steps: 5

# path
path:
  pretrain_network_g: ~  # set to your .pth if available, e.g., experiments/pretrained_models/I-NAFSSR_x2.pth
  strict_load_g: false   # allow partial/no-pretrained load if weights are missing
  resume_state: ~

# validation settings
val:
  save_img: true
  grids: false

  metrics:
    psnr: # metric name, can be arbitrary
      type: calculate_psnr
      crop_border: 0
      test_y_channel: false
    ssim:
      type: calculate_skimage_ssim

# dist training settings (kept for parity with other test files)
dist_params:
  backend: nccl
  port: 29500
